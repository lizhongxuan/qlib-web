# Redis 主节点部署
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-primary
  namespace: qlib-web
  labels:
    app: qlib-web
    component: redis-primary
spec:
  serviceName: redis-primary
  replicas: 1
  selector:
    matchLabels:
      app: qlib-web
      component: redis-primary
  template:
    metadata:
      labels:
        app: qlib-web
        component: redis-primary
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - /usr/local/etc/redis/redis.conf
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: redis-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 10Gi

---
# Redis 主节点服务
apiVersion: v1
kind: Service
metadata:
  name: redis-primary
  namespace: qlib-web
  labels:
    app: qlib-web
    component: redis-primary
spec:
  selector:
    app: qlib-web
    component: redis-primary
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  clusterIP: None

---
# Redis 哨兵部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  namespace: qlib-web
  labels:
    app: qlib-web
    component: redis-sentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qlib-web
      component: redis-sentinel
  template:
    metadata:
      labels:
        app: qlib-web
        component: redis-sentinel
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
      containers:
      - name: redis-sentinel
        image: redis:7-alpine
        ports:
        - containerPort: 26379
          name: sentinel
        command:
        - redis-sentinel
        - /usr/local/etc/redis/sentinel.conf
        volumeMounts:
        - name: sentinel-config
          mountPath: /usr/local/etc/redis/sentinel.conf
          subPath: sentinel.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -p
            - "26379"
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -p
            - "26379"
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: sentinel-config
        configMap:
          name: redis-sentinel-config

---
# Redis 哨兵服务
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: qlib-web
  labels:
    app: qlib-web
    component: redis-sentinel
spec:
  selector:
    app: qlib-web
    component: redis-sentinel
  ports:
  - name: sentinel
    port: 26379
    targetPort: 26379

---
# Redis 配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: qlib-web
  labels:
    app: qlib-web
    component: redis-config
data:
  redis.conf: |
    # 网络配置
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    
    # 安全配置
    requirepass ${REDIS_PASSWORD}
    
    # 内存配置
    maxmemory 1gb
    maxmemory-policy allkeys-lru
    
    # 持久化配置
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
    
    # 日志配置
    loglevel notice
    
    # 客户端配置
    maxclients 1000
    
    # 慢查询日志
    slowlog-log-slower-than 10000
    slowlog-max-len 128

---
# Redis 哨兵配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: qlib-web
  labels:
    app: qlib-web
    component: redis-sentinel-config
data:
  sentinel.conf: |
    port 26379
    bind 0.0.0.0
    
    # 监控主节点
    sentinel monitor mymaster redis-primary 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel parallel-syncs mymaster 1
    sentinel failover-timeout mymaster 10000
    
    # 日志配置
    logfile ""
    loglevel notice