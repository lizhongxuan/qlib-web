# 前端应用部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qlib-web-frontend
  namespace: qlib-web
  labels:
    app: qlib-web
    component: frontend
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: qlib-web
      component: frontend
  template:
    metadata:
      labels:
        app: qlib-web
        component: frontend
        version: v1.0.0
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
      containers:
      - name: frontend
        image: qlib-web-frontend:latest
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: API_BASE_URL
          value: "http://qlib-web-backend:8000"
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: ENVIRONMENT
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# 前端服务
apiVersion: v1
kind: Service
metadata:
  name: qlib-web-frontend
  namespace: qlib-web
  labels:
    app: qlib-web
    component: frontend
spec:
  selector:
    app: qlib-web
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP