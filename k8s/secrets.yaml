# Secrets 配置
apiVersion: v1
kind: Secret
metadata:
  name: qlib-web-secrets
  namespace: qlib-web
  labels:
    app: qlib-web
    component: secrets
type: Opaque
data:
  # 注意: 这些值需要用 base64 编码
  # 使用命令: echo -n "your-secret" | base64
  SECRET_KEY: eW91ci12ZXJ5LXNlY3VyZS1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u  # your-very-secure-secret-key-change-in-production
  POSTGRES_PASSWORD: eW91cl9zZWN1cmVfZGF0YWJhc2VfcGFzc3dvcmQ=  # your_secure_database_password
  POSTGRES_REPL_PASSWORD: eW91cl9yZXBsaWNhdGlvbl9wYXNzd29yZA==  # your_replication_password
  REDIS_PASSWORD: eW91cl9zZWN1cmVfcmVkaXNfcGFzc3dvcmQ=  # your_secure_redis_password
  GRAFANA_ADMIN_PASSWORD: YWRtaW5fc2VjdXJlX3Bhc3N3b3Jk  # admin_secure_password

---
# TLS 证书 Secret (可选)
apiVersion: v1
kind: Secret
metadata:
  name: qlib-web-tls
  namespace: qlib-web
  labels:
    app: qlib-web
    component: tls
type: kubernetes.io/tls
data:
  # 注意: 需要替换为实际的证书和私钥 (base64编码)
  tls.crt: LS0tLS1CRUdJTi0tLS0t  # 证书内容
  tls.key: LS0tLS1CRUdJTi0tLS0t  # 私钥内容