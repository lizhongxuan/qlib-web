# 后端应用部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qlib-web-backend
  namespace: qlib-web
  labels:
    app: qlib-web
    component: backend
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: qlib-web
      component: backend
  template:
    metadata:
      labels:
        app: qlib-web
        component: backend
        version: v1.0.0
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: backend
        image: qlib-web-backend:latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-primary:5432/$(POSTGRES_DB)"
        - name: DATABASE_REPLICA_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-replica:5432/$(POSTGRES_DB)"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-primary:6379/0"
        - name: CELERY_BROKER_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-primary:6379/1"
        - name: CELERY_RESULT_BACKEND
          value: "redis://:$(REDIS_PASSWORD)@redis-primary:6379/2"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: SECRET_KEY
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: POSTGRES_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: REDIS_PASSWORD
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: DEBUG
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: ENVIRONMENT
        - name: QLIB_DATA_PATH
          value: "/app/qlib_data"
        - name: APM_ENABLED
          value: "true"
        volumeMounts:
        - name: qlib-data
          mountPath: /app/qlib_data
          readOnly: true
        - name: static-files
          mountPath: /app/static
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
      volumes:
      - name: qlib-data
        persistentVolumeClaim:
          claimName: qlib-data-pvc
      - name: static-files
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# 后端服务
apiVersion: v1
kind: Service
metadata:
  name: qlib-web-backend
  namespace: qlib-web
  labels:
    app: qlib-web
    component: backend
spec:
  selector:
    app: qlib-web
    component: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

---
# Celery Worker 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: qlib-web
  labels:
    app: qlib-web
    component: celery-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: qlib-web
      component: celery-worker
  template:
    metadata:
      labels:
        app: qlib-web
        component: celery-worker
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: celery-worker
        image: qlib-web-backend:latest
        command: ["celery", "-A", "app.core.celery", "worker", "--loglevel=info", "--concurrency=4", "--max-tasks-per-child=1000"]
        env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-primary:5432/$(POSTGRES_DB)"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-primary:6379/0"
        - name: CELERY_BROKER_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-primary:6379/1"
        - name: CELERY_RESULT_BACKEND
          value: "redis://:$(REDIS_PASSWORD)@redis-primary:6379/2"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: SECRET_KEY
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: POSTGRES_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: REDIS_PASSWORD
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: ENVIRONMENT
        - name: QLIB_DATA_PATH
          value: "/app/qlib_data"
        volumeMounts:
        - name: qlib-data
          mountPath: /app/qlib_data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "celery -A app.core.celery inspect active"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: qlib-data
        persistentVolumeClaim:
          claimName: qlib-data-pvc
      restartPolicy: Always
      terminationGracePeriodSeconds: 60

---
# Celery Beat 调度器部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: qlib-web
  labels:
    app: qlib-web
    component: celery-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qlib-web
      component: celery-beat
  template:
    metadata:
      labels:
        app: qlib-web
        component: celery-beat
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: celery-beat
        image: qlib-web-backend:latest
        command: ["celery", "-A", "app.core.celery", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
        env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-primary:5432/$(POSTGRES_DB)"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-primary:6379/0"
        - name: CELERY_BROKER_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-primary:6379/1"
        - name: CELERY_RESULT_BACKEND
          value: "redis://:$(REDIS_PASSWORD)@redis-primary:6379/2"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: SECRET_KEY
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: POSTGRES_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qlib-web-secrets
              key: REDIS_PASSWORD
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: qlib-web-config
              key: ENVIRONMENT
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep celery"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30