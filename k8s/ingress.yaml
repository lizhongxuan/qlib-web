# Ingress 控制器配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qlib-web-ingress
  namespace: qlib-web
  labels:
    app: qlib-web
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # 安全头配置
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
spec:
  tls:
  - hosts:
    - qlib-web.example.com
    - www.qlib-web.example.com
    secretName: qlib-web-tls
  rules:
  - host: qlib-web.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: qlib-web-backend
            port:
              number: 8000
      - path: /static
        pathType: Prefix
        backend:
          service:
            name: nginx-lb
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qlib-web-frontend
            port:
              number: 80
  - host: www.qlib-web.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: qlib-web-backend
            port:
              number: 8000
      - path: /static
        pathType: Prefix
        backend:
          service:
            name: nginx-lb
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qlib-web-frontend
            port:
              number: 80

---
# 网络策略 - 安全隔离
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qlib-web-network-policy
  namespace: qlib-web
  labels:
    app: qlib-web
    component: network-policy
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # 允许从 Ingress 控制器访问
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  # 允许命名空间内部通信
  - from:
    - namespaceSelector:
        matchLabels:
          name: qlib-web
  egress:
  # 允许访问外部API（DNS、镜像拉取等）
  - {}
  # 限制数据库访问
  - to:
    - podSelector:
        matchLabels:
          component: postgres-primary
    - podSelector:
        matchLabels:
          component: postgres-replica
    ports:
    - protocol: TCP
      port: 5432
  # 限制Redis访问
  - to:
    - podSelector:
        matchLabels:
          component: redis-primary
    ports:
    - protocol: TCP
      port: 6379

---
# Pod 中断预算 - 确保高可用
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: qlib-web
  labels:
    app: qlib-web
    component: backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: qlib-web
      component: backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: qlib-web
  labels:
    app: qlib-web
    component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: qlib-web
      component: frontend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-pdb
  namespace: qlib-web
  labels:
    app: qlib-web
    component: nginx-lb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: qlib-web
      component: nginx-lb