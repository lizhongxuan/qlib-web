# 生产环境 Docker Compose 配置
version: '3.8'

services:
  # Nginx 反向代理和负载均衡
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - web_static:/var/www/static
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web_network
      - backend_network
    labels:
      - "com.qlib-web.service=nginx"
      - "com.qlib-web.environment=production"

  # PostgreSQL 数据库主库
  postgres-primary:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPL_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPL_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-primary.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/postgres/setup-replication.sql:/docker-entrypoint-initdb.d/02-replication.sql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./logs/postgres:/var/log/postgresql
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c log_destination=stderr
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend_network
    restart: unless-stopped
    labels:
      - "com.qlib-web.service=postgres-primary"
      - "com.qlib-web.environment=production"

  # PostgreSQL 读副本（可选）
  postgres-replica:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPL_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPL_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/postgres/setup-replica.sh:/docker-entrypoint-initdb.d/setup-replica.sh
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend_network
    restart: unless-stopped
    profiles:
      - replica
    labels:
      - "com.qlib-web.service=postgres-replica"
      - "com.qlib-web.environment=production"

  # Redis 主节点
  redis-primary:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_primary_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
      - ./logs/redis:/var/log/redis
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend_network
    restart: unless-stopped
    labels:
      - "com.qlib-web.service=redis-primary"
      - "com.qlib-web.environment=production"

  # Redis 哨兵（可选）
  redis-sentinel:
    image: redis:7-alpine
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./config/redis-sentinel.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-primary
    networks:
      - backend_network
    restart: unless-stopped
    profiles:
      - sentinel
    labels:
      - "com.qlib-web.service=redis-sentinel"
      - "com.qlib-web.environment=production"

  # FastAPI 后端服务（多实例）
  backend:
    image: qlib-web-backend:${VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.optimized
      args:
        VERSION: ${VERSION:-latest}
        BUILD_DATE: ${BUILD_DATE}
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB}
      - DATABASE_REPLICA_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-primary:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
      - QLIB_DATA_PATH=/app/qlib_data
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis-primary:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis-primary:6379/2
      - APM_ENABLED=true
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - qlib_data:/app/qlib_data:ro
      - ./logs/backend:/app/logs
      - web_static:/app/static
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.qlib-web.service=backend"
      - "com.qlib-web.environment=production"
      - "com.qlib-web.version=${VERSION:-latest}"

  # Vue.js 前端
  frontend:
    image: qlib-web-frontend:${VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.optimized
      args:
        VERSION: ${VERSION:-latest}
        BUILD_DATE: ${BUILD_DATE}
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.qlib-web.service=frontend"
      - "com.qlib-web.environment=production"
      - "com.qlib-web.version=${VERSION:-latest}"

  # Celery Worker
  celery-worker:
    image: qlib-web-backend:${VERSION:-latest}
    command: celery -A app.core.celery worker --loglevel=info --concurrency=4 --max-tasks-per-child=1000
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-primary:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis-primary:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis-primary:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - QLIB_DATA_PATH=/app/qlib_data
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
    volumes:
      - qlib_data:/app/qlib_data
      - ./logs/celery:/app/logs
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
    networks:
      - backend_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.qlib-web.service=celery-worker"
      - "com.qlib-web.environment=production"

  # Celery Beat 调度器
  celery-beat:
    image: qlib-web-backend:${VERSION:-latest}
    command: celery -A app.core.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-primary:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis-primary:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis-primary:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
    volumes:
      - ./logs/celery-beat:/app/logs
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
    networks:
      - backend_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.qlib-web.service=celery-beat"
      - "com.qlib-web.environment=production"

  # 监控服务 - Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend_network
      - monitoring_network
    restart: unless-stopped
    profiles:
      - monitoring
    labels:
      - "com.qlib-web.service=prometheus"
      - "com.qlib-web.environment=production"

  # 监控服务 - Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource,postgres-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring_network
    restart: unless-stopped
    profiles:
      - monitoring
    labels:
      - "com.qlib-web.service=grafana"
      - "com.qlib-web.environment=production"

  # 日志收集 - Fluentd
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    ports:
      - "24224:24224"
    volumes:
      - ./config/fluentd.conf:/fluentd/etc/fluent.conf:ro
      - ./logs:/var/log/containers:ro
    networks:
      - backend_network
    restart: unless-stopped
    profiles:
      - logging
    labels:
      - "com.qlib-web.service=fluentd"
      - "com.qlib-web.environment=production"

networks:
  web_network:
    driver: bridge
    name: qlib_web_network
  backend_network:
    driver: bridge
    name: qlib_backend_network
    internal: true
  monitoring_network:
    driver: bridge
    name: qlib_monitoring_network

volumes:
  postgres_primary_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres-primary
  postgres_replica_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres-replica
  redis_primary_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis-primary
  qlib_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/qlib
  web_static:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# 配置参数说明
# 请在 .env 文件中设置以下环境变量:
# - POSTGRES_DB=qlib_web
# - POSTGRES_USER=qlib_user
# - POSTGRES_PASSWORD=your_secure_password
# - POSTGRES_REPL_USER=repl_user
# - POSTGRES_REPL_PASSWORD=your_repl_password
# - REDIS_PASSWORD=your_redis_password
# - SECRET_KEY=your_very_secret_key
# - VERSION=latest
# - BUILD_DATE=2024-01-01T00:00:00Z
# - LOG_LEVEL=INFO
# - SENTRY_DSN=https://your-sentry-dsn
# - GRAFANA_ADMIN_PASSWORD=admin_password