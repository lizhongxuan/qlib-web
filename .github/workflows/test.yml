name: 测试和代码质量检查

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qlib_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: 安装Python依赖
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 代码格式化检查
      run: |
        cd backend
        black --check app/
        isort --check-only app/
    
    - name: 代码质量检查
      run: |
        cd backend
        flake8 app/
    
    - name: 运行后端测试
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qlib_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci-cd-very-long-key
      run: |
        cd backend
        pytest -v --cov=app --cov-report=xml --cov-report=html
    
    - name: 上传测试覆盖率报告
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    name: 前端测试
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 安装前端依赖
      run: |
        cd frontend
        npm ci
    
    - name: 代码格式化检查
      run: |
        cd frontend
        npm run lint
    
    - name: TypeScript类型检查
      run: |
        cd frontend
        npx vue-tsc --noEmit
    
    - name: 运行前端测试
      run: |
        cd frontend
        npm run test:coverage
    
    - name: 上传测试覆盖率报告
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
    
    - name: 构建前端应用
      run: |
        cd frontend
        npm run build

  docker-build:
    name: Docker构建测试
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 构建后端Docker镜像
      run: |
        cd backend
        docker build -t qlib-web-backend:test .
    
    - name: 构建前端Docker镜像
      run: |
        cd frontend
        docker build -t qlib-web-frontend:test .
    
    - name: 测试Docker Compose
      run: |
        # 创建测试用的环境变量文件
        echo "SECRET_KEY=test-secret-key-for-docker-compose-testing" > .env.test
        echo "DATABASE_URL=postgresql://test_user:test_pass@postgres:5432/qlib_test" >> .env.test
        echo "REDIS_URL=redis://redis:6379/0" >> .env.test
        
        # 验证Docker Compose配置语法
        docker-compose -f docker-compose.yml config

  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 运行Trivy安全扫描
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: 上传安全扫描结果
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 启动测试环境
      run: |
        # 创建测试环境变量
        cp .env.example .env
        
        # 启动服务
        docker-compose -f docker-compose.dev.yml up -d
        
        # 等待服务启动
        sleep 30
    
    - name: 健康检查
      run: |
        # 检查后端健康状态
        curl -f http://localhost:8001/api/v1/health || exit 1
        
        # 检查前端是否可访问
        curl -f http://localhost:3001 || exit 1
    
    - name: 运行集成测试
      run: |
        # 运行后端集成测试
        cd backend
        python -m pytest tests/integration/ -v
    
    - name: 清理测试环境
      if: always()
      run: |
        docker-compose -f docker-compose.dev.yml down -v