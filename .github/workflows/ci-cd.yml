# CI/CD 自动化流水线
name: Qlib Web CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io
  BACKEND_IMAGE_NAME: qlib-web-backend
  FRONTEND_IMAGE_NAME: qlib-web-frontend
  
jobs:
  # 代码质量检查和测试
  test:
    name: 代码测试和质量检查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']
        node-version: [16, 18, 20]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_qlib_web
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: 设置 Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 安装 Python 依赖
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry config virtualenvs.create false
        poetry install --with dev,test

    - name: 安装前端依赖
      working-directory: ./frontend
      run: |
        npm ci
        npm install -g @vue/cli

    - name: 代码格式检查 (Backend)
      working-directory: ./backend
      run: |
        black --check .
        isort --check-only .
        flake8 .

    - name: 类型检查 (Backend)
      working-directory: ./backend
      run: |
        mypy .

    - name: 代码格式检查 (Frontend)
      working-directory: ./frontend
      run: |
        npm run lint
        npm run type-check

    - name: 安全扫描 (Backend)
      working-directory: ./backend
      run: |
        bandit -r app/
        safety check

    - name: 后端单元测试
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_qlib_web
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        ENVIRONMENT: test
      run: |
        pytest --cov=app --cov-report=xml --cov-report=html --junitxml=junit.xml

    - name: 前端单元测试
      working-directory: ./frontend
      run: |
        npm run test:unit -- --coverage --watchAll=false

    - name: 端到端测试
      working-directory: ./frontend
      run: |
        npm run test:e2e

    - name: 上传测试报告
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.9' && matrix.node-version == 18
      with:
        files: ./backend/coverage.xml,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

    - name: 上传测试结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}-node${{ matrix.node-version }}
        path: |
          backend/htmlcov/
          backend/junit.xml
          frontend/coverage/
        retention-days: 30

  # 构建Docker镜像
  build:
    name: 构建Docker镜像
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录容器镜像仓库
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 提取后端镜像元数据
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 构建和推送后端镜像
      id: build-backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.optimized
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}
          BUILD_DATE=${{ github.run_id }}

    - name: 提取前端镜像元数据
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 构建和推送前端镜像
      id: build-frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.optimized
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}
          BUILD_DATE=${{ github.run_id }}

    - name: 镜像安全扫描
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.meta-backend.outputs.tags }}
        format: 'sarif'
        output: 'trivy-results-backend.sarif'

    - name: 上传安全扫描结果
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results-backend.sarif'

  # 部署到开发环境
  deploy-dev:
    name: 部署到开发环境
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev.qlib-web.example.com

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: 配置 kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config

    - name: 部署到开发环境
      working-directory: ./k8s
      run: |
        # 更新镜像标签
        kubectl set image deployment/qlib-web-backend backend=${{ needs.build.outputs.backend-image }} -n qlib-web-dev
        kubectl set image deployment/qlib-web-frontend frontend=${{ needs.build.outputs.frontend-image }} -n qlib-web-dev
        
        # 等待部署完成
        kubectl rollout status deployment/qlib-web-backend -n qlib-web-dev --timeout=300s
        kubectl rollout status deployment/qlib-web-frontend -n qlib-web-dev --timeout=300s

    - name: 运行集成测试
      run: |
        # 等待服务就绪
        sleep 30
        # 运行健康检查
        kubectl get pods -n qlib-web-dev
        # 可以添加更多的集成测试

  # 部署到预发布环境
  deploy-staging:
    name: 部署到预发布环境
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/heads/release/')
    environment:
      name: staging
      url: https://staging.qlib-web.example.com

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: 配置 kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

    - name: 部署到预发布环境
      working-directory: ./k8s
      run: |
        kubectl set image deployment/qlib-web-backend backend=${{ needs.build.outputs.backend-image }} -n qlib-web-staging
        kubectl set image deployment/qlib-web-frontend frontend=${{ needs.build.outputs.frontend-image }} -n qlib-web-staging
        
        kubectl rollout status deployment/qlib-web-backend -n qlib-web-staging --timeout=300s
        kubectl rollout status deployment/qlib-web-frontend -n qlib-web-staging --timeout=300s

    - name: 性能测试
      run: |
        # 可以集成 k6, JMeter 等性能测试工具
        echo "执行性能测试..."

  # 部署到生产环境
  deploy-prod:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://qlib-web.example.com

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: 配置 kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config

    - name: 创建部署备份
      run: |
        kubectl get deployment qlib-web-backend -n qlib-web -o yaml > backup-backend-$(date +%Y%m%d-%H%M%S).yaml
        kubectl get deployment qlib-web-frontend -n qlib-web -o yaml > backup-frontend-$(date +%Y%m%d-%H%M%S).yaml

    - name: 金丝雀部署
      working-directory: ./k8s
      run: |
        # 先部署少量实例进行灰度测试
        kubectl patch deployment qlib-web-backend -n qlib-web -p '{"spec":{"replicas":1}}'
        kubectl set image deployment/qlib-web-backend backend=${{ needs.build.outputs.backend-image }} -n qlib-web
        
        # 等待新版本就绪
        kubectl rollout status deployment/qlib-web-backend -n qlib-web --timeout=300s
        
        # 健康检查
        sleep 60
        kubectl get pods -n qlib-web -l app=qlib-web,component=backend
        
        # 如果一切正常，继续部署剩余实例
        kubectl patch deployment qlib-web-backend -n qlib-web -p '{"spec":{"replicas":3}}'
        kubectl set image deployment/qlib-web-frontend frontend=${{ needs.build.outputs.frontend-image }} -n qlib-web
        
        kubectl rollout status deployment/qlib-web-backend -n qlib-web --timeout=300s
        kubectl rollout status deployment/qlib-web-frontend -n qlib-web --timeout=300s

    - name: 验证生产部署
      run: |
        # 全面的健康检查
        kubectl get all -n qlib-web
        
        # 可以添加更多的生产验证步骤
        echo "生产环境部署完成并验证成功"

    - name: 通知部署结果
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow

  # 安全扫描
  security-scan:
    name: 安全漏洞扫描
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 依赖漏洞扫描 (Backend)
      working-directory: ./backend
      run: |
        pip install safety
        safety check --json --output safety-report.json || true

    - name: 依赖漏洞扫描 (Frontend)
      working-directory: ./frontend
      run: |
        npm audit --audit-level moderate --json > audit-report.json || true

    - name: CodeQL 分析
      uses: github/codeql-action/init@v2
      with:
        languages: python, javascript

    - name: 自动构建
      uses: github/codeql-action/autobuild@v2

    - name: 执行 CodeQL 分析
      uses: github/codeql-action/analyze@v2

    - name: 上传安全报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          backend/safety-report.json
          frontend/audit-report.json
        retention-days: 90